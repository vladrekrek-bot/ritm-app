<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#07060f">
<title>RITM — режим, питание, тренировки</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#07060f;--brd:rgba(255,255,255,.14);--txt:#f3f0ff;--mut:#a7a2c6;--a1:#a66bff;--a2:#ff5fc8;--a3:#5fd4ff;--ok:#6bffa8;--r:22px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Manrope,system-ui,sans-serif;color:var(--txt);background:var(--bg);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
/* фон */
#bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:radial-gradient(1200px 800px at 80% -10%,#25124a 0%,transparent 60%),radial-gradient(900px 700px at -10% 110%,#3a0f3a 0%,transparent 55%),#07060f}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;animation:float 18s ease-in-out infinite}
.b1{width:420px;height:420px;background:#7b3cff;top:-80px;left:30%}
.b2{width:360px;height:360px;background:#ff3fb4;bottom:-60px;right:8%;animation-delay:-6s}
.b3{width:300px;height:300px;background:#2fb8ff;top:40%;left:-60px;animation-delay:-11s;opacity:.35}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(40px,-30px) scale(1.08)}66%{transform:translate(-30px,25px) scale(.95)}}
/* стекло */
.glass{background:linear-gradient(140deg,rgba(255,255,255,.11),rgba(255,255,255,.03));border:1px solid var(--brd);backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);border-radius:var(--r);box-shadow:0 12px 40px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.18)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:14px;border:1px solid var(--brd);background:linear-gradient(140deg,rgba(255,255,255,.14),rgba(255,255,255,.04));backdrop-filter:blur(12px);cursor:pointer;font-weight:700;transition:.18s;box-shadow:inset 0 1px 0 rgba(255,255,255,.22)}
.btn:hover{transform:translateY(-1px);border-color:rgba(255,255,255,.3);background:linear-gradient(140deg,rgba(255,255,255,.2),rgba(255,255,255,.06))}
.btn:active{transform:translateY(1px) scale(.98)}
.btn.pri{background:linear-gradient(135deg,var(--a1),var(--a2));border-color:transparent;box-shadow:0 8px 24px rgba(166,107,255,.4),inset 0 1px 0 rgba(255,255,255,.35)}
.btn.danger{background:linear-gradient(135deg,#ff4d6d,#ff7a59);border-color:transparent}
.btn.sm{padding:7px 12px;border-radius:11px;font-size:13px}
.btn.ghost{background:transparent;box-shadow:none}
input,select,textarea{width:100%;padding:12px 14px;border-radius:13px;border:1px solid var(--brd);background:rgba(0,0,0,.28);outline:none;transition:.15s}
input:focus,select:focus,textarea:focus{border-color:var(--a1);box-shadow:0 0 0 3px rgba(166,107,255,.25)}
select option{background:#1a1530}
input[type=time]{color-scheme:dark}
label.f{display:block;font-size:13px;color:var(--mut);margin:12px 0 6px;font-weight:600}
.row{display:flex;gap:12px}.row>*{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 14px;border-radius:999px;border:1px solid var(--brd);background:rgba(255,255,255,.05);cursor:pointer;font-weight:600;font-size:14px;transition:.15s;user-select:none}
.chip:hover{background:rgba(255,255,255,.1)}
.chip.on{background:linear-gradient(135deg,rgba(166,107,255,.55),rgba(255,95,200,.45));border-color:rgba(255,255,255,.35);box-shadow:0 4px 16px rgba(166,107,255,.35)}
.mut{color:var(--mut)}
.appic{border-radius:50%;box-shadow:0 8px 28px rgba(255,140,40,.35);display:block}
.logo{font-family:Unbounded,sans-serif;font-weight:800;letter-spacing:.06em;background:linear-gradient(90deg,#fff,#d9b8ff 40%,#ff8fd8);-webkit-background-clip:text;background-clip:text;color:transparent}
.screen{position:relative;z-index:1;height:100%}
/* авторизация / анкета */
.center{display:flex;align-items:center;justify-content:center;height:100%;padding:20px;overflow:auto}
.card{width:100%;max-width:440px;padding:30px}
.card.wide{max-width:620px}
.tabs{display:flex;background:rgba(0,0,0,.25);border-radius:14px;padding:4px;margin:20px 0 6px}
.tabs button{flex:1;padding:10px;border:0;background:none;border-radius:11px;cursor:pointer;font-weight:700;color:var(--mut)}
.tabs button.on{background:linear-gradient(135deg,rgba(166,107,255,.6),rgba(255,95,200,.45));color:#fff}
.err{color:#ff8aa0;font-size:13px;min-height:18px;margin-top:10px}
.steps{display:flex;gap:6px;margin:16px 0 20px}.steps i{flex:1;height:5px;border-radius:9px;background:rgba(255,255,255,.12)}.steps i.on{background:linear-gradient(90deg,var(--a1),var(--a2))}
h2{font-family:Unbounded,sans-serif;font-size:22px;margin-bottom:4px}
h3{font-size:17px;margin-bottom:10px}
/* приложение */
#app{display:flex;gap:18px;padding:18px}
.side{width:230px;flex-shrink:0;padding:22px 14px;display:flex;flex-direction:column;gap:6px}
.side .logo{font-size:24px;padding:0 10px 18px}
.nav{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;cursor:pointer;font-weight:700;color:var(--mut);border:1px solid transparent;transition:.15s}
.nav:hover{background:rgba(255,255,255,.06);color:#fff}
.nav.on{color:#fff;background:linear-gradient(140deg,rgba(166,107,255,.35),rgba(255,95,200,.18));border-color:rgba(255,255,255,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.nav .ic{font-size:18px;width:22px;text-align:center}
.side .bottom{margin-top:auto;font-size:12px;padding:10px}
.main{flex:1;overflow:auto;padding-right:4px}
.main::-webkit-scrollbar{width:8px}.main::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:9px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:12px;flex-wrap:wrap}
.top h1{font-family:Unbounded,sans-serif;font-size:26px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.pad{padding:20px}
.stat .v{font-family:Unbounded,sans-serif;font-size:26px;margin-top:6px}.stat .l{font-size:13px;color:var(--mut);font-weight:600}
/* календарь */
.cal{display:grid;grid-template-columns:1.35fr 1fr;gap:16px}
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.calhead .m{font-family:Unbounded,sans-serif;font-size:19px;text-transform:capitalize}
.dow,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
.dow div{text-align:center;font-size:12px;color:var(--mut);font-weight:700;padding-bottom:4px}
.day{aspect-ratio:1/0.9;border-radius:14px;padding:7px 8px;cursor:pointer;border:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.035);display:flex;flex-direction:column;justify-content:space-between;transition:.15s}
.day:hover{background:rgba(255,255,255,.09);transform:translateY(-1px)}
.day.out{opacity:.32}
.day.today{border-color:rgba(255,95,200,.6);box-shadow:0 0 0 1px rgba(255,95,200,.35),0 0 18px rgba(255,95,200,.25)}
.day.sel{background:linear-gradient(140deg,rgba(166,107,255,.45),rgba(255,95,200,.25));border-color:rgba(255,255,255,.35)}
.day .n{font-weight:800;font-size:14px}
.dots{display:flex;gap:3px;flex-wrap:wrap}.dots i{width:7px;height:7px;border-radius:50%}
.evlist{display:flex;flex-direction:column;gap:9px;margin-top:12px}
.ev{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:15px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-left:4px solid var(--c);cursor:pointer;transition:.15s}
.ev:hover{background:rgba(255,255,255,.09)}
.ev .t{font-weight:800;font-size:13px;min-width:92px;color:#fff}
.ev .ti{font-weight:700}
.ev .no{font-size:12.5px;color:var(--mut);margin-top:2px}
.ev.done{opacity:.45}.ev.done .ti{text-decoration:line-through}
.ev.now{background:linear-gradient(140deg,rgba(166,107,255,.28),rgba(255,95,200,.12));box-shadow:0 0 0 1px rgba(255,255,255,.2)}
.chk{width:24px;height:24px;border-radius:8px;border:1.5px solid var(--brd);flex-shrink:0;display:grid;place-items:center;cursor:pointer;font-size:14px}
.chk.on{background:linear-gradient(135deg,var(--a1),var(--a2));border-color:transparent}
.badge{font-size:11px;padding:3px 8px;border-radius:99px;background:rgba(255,255,255,.1);margin-left:6px;font-weight:700}
/* модалки */
.ov{position:fixed;inset:0;z-index:50;background:rgba(5,3,12,.6);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .2s}
.ov .card{max-height:92vh;overflow:auto;animation:pop .25s cubic-bezier(.2,1.4,.4,1)}
@keyframes fade{from{opacity:0}}@keyframes pop{from{transform:scale(.92);opacity:0}}
/* будильник */
#alarm{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;background:radial-gradient(circle at center,rgba(255,95,200,.35),rgba(7,6,15,.92) 60%);backdrop-filter:blur(10px);text-align:center;padding:20px}
#alarm .clock{font-family:Unbounded,sans-serif;font-size:min(22vw,120px);animation:pulse 1s infinite}
#alarm .lbl{font-size:26px;font-weight:800}
@keyframes pulse{50%{transform:scale(1.06);text-shadow:0 0 40px #ff5fc8}}
.ring{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;font-size:64px;background:linear-gradient(135deg,var(--a1),var(--a2));box-shadow:0 0 0 0 rgba(255,95,200,.6);animation:ring 1.2s infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(255,95,200,.6)}100%{box-shadow:0 0 0 50px rgba(255,95,200,0)}}
/* тосты */
#toasts{position:fixed;right:18px;top:18px;z-index:90;display:flex;flex-direction:column;gap:10px;max-width:340px}
.toast{padding:14px 16px;animation:slide .3s;display:flex;gap:12px;align-items:flex-start}
.toast b{display:block}
@keyframes slide{from{transform:translateX(40px);opacity:0}}
/* питание / тренировки */
.macro{display:flex;gap:14px;align-items:center}
.bar{height:8px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;border-radius:9px}
table{width:100%;border-collapse:collapse;font-size:14px}
td{padding:8px 6px;border-bottom:1px solid rgba(255,255,255,.07)}
td.r{text-align:right;color:var(--mut);white-space:nowrap}
.meal h3{display:flex;justify-content:space-between;align-items:baseline}
.ex{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.07);font-size:14px}
.ex span:last-child{color:var(--mut);font-weight:700}
.note{font-size:13px;color:var(--mut);padding:12px 14px;border-radius:13px;background:rgba(255,255,255,.04);border:1px dashed rgba(255,255,255,.14)}
.hero{padding:24px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.hero .big{font-family:Unbounded,sans-serif;font-size:42px}
.prog{height:10px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--a3),var(--a1),var(--a2))}
.sw{position:relative;width:46px;height:26px;border-radius:99px;background:rgba(255,255,255,.15);cursor:pointer;flex-shrink:0;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:linear-gradient(135deg,var(--a1),var(--a2))}.sw.on::after{left:23px}
.li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.07)}
input[type=range]{padding:0;accent-color:var(--a2)}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:190px;border:2px dashed rgba(255,255,255,.2);border-radius:18px;cursor:pointer;margin-top:12px;background:rgba(255,255,255,.03);overflow:hidden;transition:.15s;text-align:center;padding:10px}
.drop:hover,.drop.over{border-color:var(--a2);background:rgba(255,95,200,.07)}
.drop img{width:100%;max-height:280px;object-fit:cover;border-radius:13px}
.scan{position:relative;padding:18px;border-radius:14px;background:rgba(255,255,255,.05);margin-top:12px;overflow:hidden;font-weight:700}
.scan::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(166,107,255,.35),transparent);animation:sh 1.3s infinite}
.cmp{position:relative;aspect-ratio:3/4;max-height:540px;max-width:420px;border-radius:18px;overflow:hidden;background:#000;margin:14px auto 0;user-select:none}
.cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.cl{position:absolute;top:0;bottom:0;width:3px;background:#fff;box-shadow:0 0 14px #ff5fc8;transform:translateX(-50%);pointer-events:none}
.cl::after{content:"⇆";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--a1),var(--a2));display:grid;place-items:center;font-weight:800;box-shadow:0 4px 16px rgba(0,0,0,.4)}
.cmp input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;margin:0;padding:0}
.tag{position:absolute;top:10px;padding:5px 10px;border-radius:99px;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);font-size:12px;font-weight:700;pointer-events:none}.tag.l{left:10px}.tag.r{right:10px}
.side2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.side2 div{position:relative;aspect-ratio:3/4;border-radius:16px;overflow:hidden;background:#000}.side2 img{width:100%;height:100%;object-fit:cover}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:12px}
.ph{border-radius:16px;overflow:hidden;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);position:relative}
.ph .im{aspect-ratio:3/4;background:rgba(0,0,0,.3);display:grid;place-items:center;font-size:30px}.ph .im img{width:100%;height:100%;object-fit:cover}
.ph .in{padding:9px 11px;font-size:13px}.ph .x{position:absolute;top:6px;right:6px}
@keyframes sh{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
@media (max-width:980px){.cal,.g2{grid-template-columns:1fr}.g4{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr}}
.center{padding-top:calc(20px + env(safe-area-inset-top));padding-bottom:calc(20px + env(safe-area-inset-bottom))}
#app{padding-top:calc(18px + env(safe-area-inset-top));padding-bottom:calc(18px + env(safe-area-inset-bottom));padding-left:calc(18px + env(safe-area-inset-left));padding-right:calc(18px + env(safe-area-inset-right))}
#toasts{top:calc(18px + env(safe-area-inset-top))}
html.native body{-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
html.native input,html.native textarea{-webkit-user-select:text;user-select:text}
@media (max-width:760px){
 input,select,textarea{font-size:16px}
 #app{padding:calc(8px + env(safe-area-inset-top)) 8px calc(6px + env(safe-area-inset-bottom))}
 #toasts{left:12px;right:12px;max-width:none}
 #app{flex-direction:column-reverse;padding:10px;gap:10px}
 .side{width:100%;flex-direction:row;padding:6px;justify-content:space-around;gap:2px}
 .side .logo,.side .bottom{display:none}
 .nav{flex-direction:column;gap:2px;padding:8px 6px;font-size:10px}
 .nav .ic{font-size:20px}
 .top h1{font-size:20px}
}
</style>
</head>
<body>
<div id="bg"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>

<!-- ВХОД -->
<div id="auth" class="screen hidden"><div class="center"><form class="card glass" id="authForm" autocomplete="off">
 <div style="display:flex;align-items:center;gap:14px"><img src="icon.png" class="appic" width="64" height="64" alt=""><div class="logo" style="font-size:34px">RITM</div></div>
 <div class="mut" style="margin-top:6px">Твой режим, еда и тренировки — в одном месте</div>
 <div class="tabs"><button type="button" data-m="login" class="on">Вход</button><button type="button" data-m="reg">Регистрация</button></div>
 <label class="f">Логин</label><input id="aLogin" maxlength="24" placeholder="например, vlad">
 <label class="f">Пароль</label><input id="aPass" type="password" placeholder="минимум 4 символа">
 <div id="aPass2Wrap" class="hidden"><label class="f">Повтори пароль</label><input id="aPass2" type="password"></div>
 <div class="err" id="aErr"></div>
 <button class="btn pri" style="width:100%;margin-top:6px" id="aBtn">Войти</button>
 <div class="mut" style="font-size:12px;margin-top:14px;text-align:center">Демо-версия: аккаунт хранится только в этом браузере</div>
</form></div></div>

<!-- АНКЕТА -->
<div id="onb" class="screen hidden"><div class="center"><div class="card wide glass" id="onbCard"></div></div></div>

<!-- ПРИЛОЖЕНИЕ -->
<div id="app" class="screen hidden">
 <nav class="side glass" id="side">
  <div class="logo" style="display:flex;align-items:center;gap:10px"><img src="icon.png" class="appic" width="38" height="38" alt="">RITM</div>
  <div class="nav" data-v="home"><span class="ic">🏠</span>Главная</div>
  <div class="nav" data-v="cal"><span class="ic">📅</span>Календарь</div>
  <div class="nav" data-v="food"><span class="ic">🥗</span>Питание</div>
  <div class="nav" data-v="gym"><span class="ic">🏋️</span>Тренировки</div>
  <div class="nav" data-v="prog"><span class="ic">📈</span>Прогресс</div>
  <div class="nav" data-v="alarm"><span class="ic">⏰</span>Будильник</div>
  <div class="nav" data-v="prof"><span class="ic">👤</span>Профиль</div>
  <div class="bottom mut" id="sideUser"></div>
 </nav>
 <main class="main" id="view"></main>
</div>

<div id="modal"></div>
<div id="alarm" class="hidden"><div class="ring">⏰</div><div class="clock" id="alClock">07:00</div><div class="lbl" id="alLbl">Подъём</div><div class="mut" id="alNote"></div>
 <div class="row" style="gap:12px;margin-top:10px"><button class="btn" id="alSnooze">😴 Ещё 5 минут</button><button class="btn pri" id="alStop">✅ Я встал</button></div></div>
<div id="toasts"></div>

<script>
/* ===== утилиты ===== */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const toMin=t=>{const[a,b]=(t||'0:0').split(':').map(Number);return a*60+b};
const fmt=m=>{m=((m%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const DOW=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'], ORDER=[1,2,3,4,5,6,0];
const DOWF=['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
const MON=['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
const MONG=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const TYPES={wake:{n:'Подъём',c:'#ffb86b',i:'⏰'},hygiene:{n:'Гигиена',c:'#6bd5ff',i:'🚿'},warm:{n:'Зарядка',c:'#ffe66b',i:'🤸'},food:{n:'Еда',c:'#6bffa8',i:'🍳'},gym:{n:'Зал',c:'#ff5fc8',i:'🏋️'},sport:{n:'Спорт',c:'#b06bff',i:'⚽'},study:{n:'Учёба/работа',c:'#9aa8c8',i:'📚'},pc:{n:'Компьютер',c:'#6b8bff',i:'💻'},sleep:{n:'Сон',c:'#8a7dff',i:'🌙'},other:{n:'Другое',c:'#e0dcf0',i:'✨'}};

/* ===== хранилище ===== */
const KEY='ritm_v1';
function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
let DB=load()||{users:{},current:null};
let U=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}if(typeof syncNotifs==='function')syncNotifs()}
async function hash(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('ritm:'+s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=7;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return'x'+h}}

function show(id){['auth','onb','app'].forEach(x=>$('#'+x).classList.toggle('hidden',x!==id))}

$$('.tabs button').forEach(b=>b.onclick=()=>{authMode=b.dataset.m;$$('.tabs button').forEach(x=>x.classList.toggle('on',x===b));$('#aPass2Wrap').classList.toggle('hidden',authMode!=='reg');$('#aBtn').textContent=authMode==='reg'?'Создать аккаунт':'Войти';$('#aErr').textContent=''});
$('#authForm').onsubmit=async e=>{e.preventDefault();
 const l=$('#aLogin').value.trim().toLowerCase(),p=$('#aPass').value,err=$('#aErr');
 if(!/^[a-zа-я0-9_.-]{3,24}$/i.test(l))return err.textContent='Логин: 3–24 символа (буквы, цифры, _ . -)';
 if(p.length<4)return err.textContent='Пароль минимум 4 символа';
 const h=await hash(p);
 if(authMode==='reg'){
  if(DB.users[l])return err.textContent='Такой логин уже есть';
  if(p!==$('#aPass2').value)return err.textContent='Пароли не совпадают';
  DB.users[l]={login:l,hash:h,profile:null,events:[],done:{},settings:{vol:.9,sound:'siren'}};
 }else{
  if(!DB.users[l]||DB.users[l].hash!==h)return err.textContent='Неверный логин или пароль';
 }
 DB.current=l;save();boot();
};

/* ===== генерация расписания ===== */
function genSchedule(p){
 const all=[0,1,2,3,4,5,6],wk=[1,2,3,4,5],w=toMin(p.wake);
 const E=o=>Object.assign({id:uid(),days:all,date:null,alarm:false,note:'',skip:[]},o);
 const L=[
  E({title:'Подъём',type:'wake',start:fmt(w),end:fmt(w+10),alarm:true,note:'Встаём! Сразу стакан воды'}),
  E({title:'Умыться, почистить зубы',type:'hygiene',start:fmt(w+10),end:fmt(w+25),note:'Можно сразу помыть голову / душ'}),
  E({title:'Зарядка',type:'warm',start:fmt(w+25),end:fmt(w+35),note:'10 минут — список во вкладке «Тренировки»'}),
  E({title:'Завтрак',type:'food',start:fmt(w+35),end:fmt(w+55),note:p.breakfast||''}),
 ];
 if(p.workOn)L.push(E({title:'Учёба / работа',type:'study',start:p.workFrom,end:p.workTo,days:wk}));
 let lunch=780;if(p.workOn&&toMin(p.workTo)>720&&toMin(p.workTo)<960)lunch=toMin(p.workTo)+15;
 L.push(E({title:'Обед',type:'food',start:fmt(lunch),end:fmt(lunch+30),note:'Смотри порции во вкладке «Питание»'}));
 const gd=p.gymDays||[];
 if(gd.length){const g=toMin(p.gymTime);
  L.push(E({title:'Перекус перед залом',type:'food',start:fmt(g-75),end:fmt(g-60),days:[...gd],note:'Углеводы + немного белка'}));
  L.push(E({title:'Тренировка',type:'gym',start:p.gymTime,end:fmt(g+p.gymDur),days:[...gd],note:p.gymFocus||'Программа — во вкладке «Тренировки»'}));
 }
 const rest=all.filter(d=>!gd.includes(d));
 if(rest.length)L.push(E({title:'Перекус',type:'food',start:'16:30',end:'16:45',days:rest,note:p.breakfast||''}));
 if(p.sport&&p.sport.trim()&&p.sportDays.length){const s=toMin(p.sportTime);L.push(E({title:p.sport.trim(),type:'sport',start:p.sportTime,end:fmt(s+p.sportDur),days:[...p.sportDays]}))}
 L.push(E({title:'Ужин',type:'food',start:'19:00',end:'19:30'}));
 if(p.pcOn)L.push(E({title:'Компьютер',type:'pc',start:p.pcFrom,end:p.pcTo,note:'Раз в час — встать и размяться 2 минуты'}));
 const sl=toMin(p.sleep);
 L.push(E({title:'Подготовка ко сну',type:'hygiene',start:fmt(sl-20),end:fmt(sl),note:'Без телефона, лёгкая растяжка'}));
 L.push(E({title:'Сон',type:'sleep',start:p.sleep,end:p.wake}));
 L.push(E({title:'Фото прогресса + взвешивание',type:'other',start:fmt(w+3),end:fmt(w+8),days:[6],checkin:true,note:'Натощак, после туалета. Вкладка «Прогресс» → «Отметиться»'}));
 return L;
}
function eventsFor(d){const s=iso(d),w=d.getDay();return U.events.filter(e=>(e.date===s||(!e.date&&e.days.includes(w)))&&!(e.skip||[]).includes(s)).sort((a,b)=>toMin(a.start)-toMin(b.start))}

/* ===== питание ===== */
const FOOD={egg:{n:'Яйца',p:12.7,f:10.9,c:.7,pc:55},chicken:{n:'Куриное филе',p:23,f:1.5,c:0},beef:{n:'Говядина постная',p:21,f:8,c:0},fish:{n:'Рыба (минтай/тунец)',p:20,f:2,c:0},oats:{n:'Овсянка (сухая)',p:12,f:6,c:60},buck:{n:'Гречка (сухая)',p:12.6,f:3.3,c:62},rice:{n:'Рис (сухой)',p:7,f:.6,c:78},cottage:{n:'Творог 5%',p:17,f:5,c:3},banana:{n:'Банан',p:1.5,f:.3,c:21},veg:{n:'Овощи / салат',p:1.5,f:.2,c:5},oil:{n:'Оливковое масло',p:0,f:100,c:0},bread:{n:'Цельнозерновой хлеб',p:9,f:3,c:43}};
const kc=(f,g)=>(f.p*4+f.f*9+f.c*4)*g/100;
function calcNutrition(p){
 const bmr=10*p.weight+6.25*p.height-5*p.age+(p.sex==='m'?5:-161);
 const gd=(p.gymDays||[]).length,sd=(p.sport&&p.sport.trim())?(p.sportDays||[]).length:0;
 const act=Math.min(1.9,(p.pcOn?1.25:1.35)+gd*.05+sd*.04);
 const tdee=bmr*act,teen=p.age<18;
 let kcal=tdee,label='поддержание';
 if(p.goal==='cut'){kcal=tdee*(teen?.9:.82);kcal=Math.max(kcal,bmr,p.sex==='m'?1700:1400);label='сушка'}
 if(p.goal==='bulk'){kcal=tdee*1.1;label='набор массы'}
 const prot=p.weight*(p.goal==='cut'?2:p.goal==='bulk'?1.8:1.6),fat=p.weight*.9,carb=Math.max(80,(kcal-prot*4-fat*9)/4);
 kcal=prot*4+fat*9+carb*4;
 const plan=[{n:'Завтрак',s:.27,pr:'egg',cb:'oats',ex:[['banana',100]]},{n:'Обед',s:.33,pr:'chicken',cb:'buck',ex:[['veg',200]]},{n:'Перекус',s:.13,pr:'cottage',cb:'bread',ex:[]},{n:'Ужин',s:.27,pr:p.goal==='bulk'?'beef':'fish',cb:'rice',ex:[['veg',200]]}];
 const meals=plan.map(m=>{
  const P=prot*m.s,F=fat*m.s,C=carb*m.s,pr=FOOD[m.pr],cb=FOOD[m.cb];
  let eP=0,eF=0,eC=0;m.ex.forEach(([k,g])=>{eP+=FOOD[k].p*g/100;eF+=FOOD[k].f*g/100;eC+=FOOD[k].c*g/100});
  let pg=0,cg=0;for(let i=0;i<3;i++){cg=Math.max(0,(C-eC-pg*pr.c/100)/(cb.c/100));pg=Math.max(0,(P-eP-cg*cb.p/100)/(pr.p/100))}
  let items=[];
  if(pr.pc){const n=Math.max(1,Math.round(pg/pr.pc));items.push(['egg',n*pr.pc,n+' шт'])}else items.push([m.pr,Math.round(pg/5)*5]);
  items.push([m.cb,Math.round(cg/5)*5]);m.ex.forEach(([k,g])=>items.push([k,g]));
  let fNow=items.reduce((a,[k,g])=>a+FOOD[k].f*g/100,0);const oil=Math.round(Math.max(0,F-fNow)/5)*5;if(oil>=5&&m.ex.some(x=>x[0]==='veg'))items.push(['oil',oil]);
  const t=items.reduce((a,[k,g])=>({p:a.p+FOOD[k].p*g/100,f:a.f+FOOD[k].f*g/100,c:a.c+FOOD[k].c*g/100,k:a.k+kc(FOOD[k],g)}),{p:0,f:0,c:0,k:0});
  return{n:m.n,items,t};
 });
 return{bmr,tdee,kcal,prot,fat,carb,meals,label,teen,water:Math.round(p.weight*35/100)/10};
}

function vHome(){
 const now=new Date(),ds=iso(now),m=now.getHours()*60+now.getMinutes(),L=eventsFor(now),N=calcNutrition(U.profile);
 const cur=L.find(e=>{const s=toMin(e.start),en=toMin(e.end);return en>s?m>=s&&m<en:false});

let IDB=null;const PH={},MEMPH={};let cmpA=null,cmpB=null,cmpMode='slide';
function idb(){if(!IDB)IDB=new Promise((ok,no)=>{try{const r=indexedDB.open('ritm_photos',1);r.onupgradeneeded=()=>r.result.createObjectStore('p');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}catch(e){no(e)}});return IDB}
async function pPut(k,v){const d=await idb();return new Promise((ok,no)=>{const t=d.transaction('p','readwrite');t.objectStore('p').put(v,k);t.oncomplete=()=>ok();t.onerror=()=>no(t.error)})}
async function pGet(k){const d=await idb();return new Promise(ok=>{const r=d.transaction('p').objectStore('p').get(k);r.onsuccess=()=>ok(r.result||null);r.onerror=()=>ok(null)})}
async function pDel(k){try{const d=await idb();d.transaction('p','readwrite').objectStore('p').delete(k)}catch(e){}}
async function phURL(id){if(PH[id])return PH[id];let b=MEMPH[id]||null;if(!b){try{b=await pGet(U.login+':'+id)}catch(e){}}if(!b)return null;return PH[id]=URL.createObjectURL(b)}

function wChart(W){
 const w=640,h=230,pl=42,pr=18,pt=18,pb=32,ws=W.map(x=>x.weight),mn=Math.floor(Math.min(...ws)-1),mx=Math.ceil(Math.max(...ws)+1);
 const t0=+new Date(W[0].date),t1=+new Date(W[W.length-1].date);
 const X=d=>pl+(t1>t0?(+new Date(d)-t0)/(t1-t0):.5)*(w-pl-pr),Y=v=>pt+(1-(v-mn)/(mx-mn))*(h-pt-pb);
 let g='';for(let i=0;i<=4;i++){const v=mn+(mx-mn)*i/4,y=Y(v);g+=`<line x1="${pl}" x2="${w-pr}" y1="${y}" y2="${y}" stroke="rgba(255,255,255,.08)"/><text x="${pl-8}" y="${y+4}" text-anchor="end" fill="#a7a2c6" font-size="11">${v.toFixed(0)}</text>`}
 const pts=W.map(x=>[X(x.date),Y(x.weight)]),line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
 const area=W.length>1?line+` L${pts[pts.length-1][0]} ${h-pb} L${pts[0][0]} ${h-pb} Z`:'';
 return`<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block"><defs><linearGradient id="wl" x1="0" x2="1"><stop offset="0" stop-color="#5fd4ff"/><stop offset=".5" stop-color="#a66bff"/><stop offset="1" stop-color="#ff5fc8"/></linearGradient><linearGradient id="wa" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#a66bff" stop-opacity=".35"/><stop offset="1" stop-color="#a66bff" stop-opacity="0"/></linearGradient></defs>${g}
 ${area?`<path d="${area}" fill="url(#wa)"/>`:''}<path d="${line}" fill="none" stroke="url(#wl)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
 ${W.map((x,i)=>`<circle cx="${pts[i][0]}" cy="${pts[i][1]}" r="5" fill="#fff" stroke="#ff5fc8" stroke-width="2.5"/>${W.length<=12||i===0||i===W.length-1?`<text x="${pts[i][0]}" y="${pts[i][1]-11}" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">${x.weight}</text><text x="${pts[i][0]}" y="${h-10}" text-anchor="middle" fill="#a7a2c6" font-size="10">${fdate(x.date)}</text>`:''}`).join('')}</svg>`;

async function shrink(file,MAX=1024){
 const url=URL.createObjectURL(file);
 const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=url});
 const sc=Math.min(1,MAX/Math.max(img.width,img.height)),cv=document.createElement('canvas');cv.width=Math.round(img.width*sc);cv.height=Math.round(img.height*sc);
 cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);URL.revokeObjectURL(url);
 return new Promise(ok=>cv.toBlob(b=>ok(b),'image/jpeg',.85));
}

  <button class="btn" style="width:100%;margin-top:16px" id="testAl">🔊 Проверить будильник</button>
  <div class="note" style="margin-top:14px">${NATIVE?'Будильник приходит системным уведомлением со звуком сирены, даже если приложение закрыто. Громкость = громкость звонка; в беззвучном режиме iOS звук глушит — держи переключатель включённым.':'В демо на ПК будильник звенит, пока открыта вкладка. В версии для айфона он приходит системным уведомлением со звуком.'}</div></div></div>`;
 $('#addAl').onclick=()=>{const e={id:uid(),title:'Подъём',type:'wake',start:'07:00',end:'07:10',days:[1,2,3,4,5],date:null,alarm:true,note:'',skip:[]};U.events.push(e);save();editEvent(e,new Date())};
 $$('[data-ed]').forEach(b=>b.onclick=()=>editEvent(U.events.find(e=>e.id===b.dataset.ed),new Date()));
 $$('[data-off]').forEach(b=>b.onclick=()=>{U.events.find(e=>e.id===b.dataset.off).alarm=false;save();vAlarm();toast('🔕','Будильник выключен','Дело осталось в календаре')});
 $$('[data-snd]').forEach(c=>c.onclick=()=>{s.sound=c.dataset.snd;save();vAlarm()});
 $('#vol').oninput=ev=>{s.vol=+ev.target.value;$('#vv').textContent=Math.round(s.vol*100)+'%';save()};
 $('#testAl').onclick=()=>showAlarm({title:'Тест будильника',start:fmt(new Date().getHours()*60+new Date().getMinutes()),note:'Так он будет звенеть'},true);
}

function vProf(){
 const p=U.profile,N=calcNutrition(p),bmi=p.weight/((p.height/100)**2);
 const gl={cut:'🔥 Сушка',bulk:'💪 Набор массы',keep:'⚖️ Поддержание',regime:'🗓️ Режим дня'}[p.goal];
 $('#view').innerHTML=`<div class="top"><h1>Профиль</h1><div class="row" style="flex:0"><button class="btn" id="logout">Выйти</button><button class="btn pri" id="editP">Изменить анкету</button></div></div>
 <div class="grid g4"><div class="glass pad stat"><div class="l">Возраст</div><div class="v">${p.age}</div></div><div class="glass pad stat"><div class="l">Рост</div><div class="v">${p.height} см</div></div><div class="glass pad stat"><div class="l">Вес</div><div class="v">${p.weight} кг</div></div><div class="glass pad stat"><div class="l">ИМТ</div><div class="v">${bmi.toFixed(1)}</div></div></div>
 <div class="grid g2" style="margin-top:16px"><div class="glass pad"><h3>${esc(p.name)} · ${gl}</h3>
  <div class="li"><span class="mut">Зал</span><span>${(p.gymDays||[]).length?ORDER.filter(d=>p.gymDays.includes(d)).map(d=>DOW[d]).join(', ')+' в '+p.gymTime:'нет'}</span></div>
  <div class="li"><span class="mut">Спорт</span><span>${p.sport&&p.sportDays.length?esc(p.sport)+' · '+ORDER.filter(d=>p.sportDays.includes(d)).map(d=>DOW[d]).join(', '):'нет'}</span></div>
  <div class="li"><span class="mut">Подъём / отбой</span><span>${p.wake} / ${p.sleep}</span></div>
  <div class="li"><span class="mut">Норма калорий</span><span>${Math.round(N.kcal)} ккал</span></div></div>
 <div class="glass pad"><h3>Данные</h3><div class="mut" style="font-size:14px;margin-bottom:14px">Всё хранится в этом браузере. В полной версии будет сервер и синхронизация ПК ↔ айфон.</div>
  <button class="btn" style="width:100%" id="regen">🔄 Пересобрать расписание из анкеты</button>
  <button class="btn danger" style="width:100%;margin-top:10px" id="wipe">Удалить аккаунт</button></div></div>`;
 $('#editP').onclick=startOnb;
 $('#logout').onclick=()=>{DB.current=null;save();U=null;show('auth')};
 $('#regen').onclick=()=>confirmBox('Пересобрать расписание?','Твои ручные правки в календаре пропадут.',()=>{U.events=genSchedule(p);save();toast('🔄','Расписание пересобрано','')});
 $('#wipe').onclick=()=>confirmBox('Удалить аккаунт?','Все данные будут стёрты без возможности восстановления.',()=>{delete DB.users[U.login];DB.current=null;save();U=null;show('auth')});
}
function confirmBox(t,s,ok){$('#modal').innerHTML=`<div class="ov"><div class="card glass"><h2>${t}</h2><div class="mut" style="margin:10px 0 20px">${s}</div><div class="row"><button class="btn" id="cN">Отмена</button><button class="btn danger" id="cY">Да</button></div></div></div>`;$('#cN').onclick=closeModal;$('#cY').onclick=()=>{closeModal();ok()}}

/* ===== уведомления и звук ===== */
function toast(i,t,s){const d=document.createElement('div');d.className='toast glass';d.innerHTML=`<div style="font-size:24px">${i}</div><div><b>${esc(t)}</b><span class="mut" style="font-size:13px">${esc(s)}</span></div>`;$('#toasts').appendChild(d);setTimeout(()=>{d.style.transition='.3s';d.style.opacity=0;setTimeout(()=>d.remove(),300)},6000)}
function askNotif(){if(LN){LN.requestPermissions().then(r=>{const ok=r.display==='granted';toast(ok?'🔔':'⚠️',ok?'Уведомления включены':'Уведомления запрещены',ok?'Будильник и напоминания будут приходить даже при закрытом приложении':'Включи их: Настройки → RITM → Уведомления');if(ok)syncNotifs()}).catch(()=>{});return}if(!('Notification'in window))return toast('⚠️','Не поддерживается','Напоминания будут внутри приложения');Notification.requestPermission().then(r=>toast(r==='granted'?'🔔':'⚠️',r==='granted'?'Уведомления включены':'Уведомления запрещены',r==='granted'?'Будем напоминать о делах':'Напоминания будут внутри приложения')).catch(()=>toast('⚠️','Браузер не дал доступ','Напоминания будут внутри приложения'))}
function sysNotif(t,b){try{if('Notification'in window&&Notification.permission==='granted')new Notification(t,{body:b})}catch(e){}}
let AC=null;
function ac(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}return AC}
document.addEventListener('pointerdown',ac);
function chime(){const a=ac();if(!a)return;[660,990].forEach((f,i)=>{const o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,a.currentTime+i*.18);g.gain.linearRampToValueAtTime(.35*U.settings.vol,a.currentTime+i*.18+.02);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+i*.18+.5);o.connect(g).connect(a.destination);o.start(a.currentTime+i*.18);o.stop(a.currentTime+i*.18+.55)})}
let siren=null;
function startSiren(){stopSiren();const a=ac();if(!a)return;const g=a.createGain(),o1=a.createOscillator(),o2=a.createOscillator(),comp=a.createDynamicsCompressor();
 o1.type='square';o2.type='sawtooth';o2.detune.value=12;o1.connect(g);o2.connect(g);g.connect(comp).connect(a.destination);o1.start();o2.start();
 const V=()=>U.settings.vol,mode=U.settings.sound;let t=0;g.gain.value=mode==='rise'?.05:V();
 const iv=setInterval(()=>{t++;const now=a.currentTime;
  if(mode==='siren'){const f=t%2?1320:880;o1.frequency.setValueAtTime(f,now);o2.frequency.setValueAtTime(f,now);g.gain.setValueAtTime(V(),now)}
  else if(mode==='beep'){o1.frequency.setValueAtTime(1000,now);o2.frequency.setValueAtTime(1000,now);g.gain.setValueAtTime(t%4<3&&t%2?V():0,now)}
  else{const f=t%2?1100:1100*1.26;o1.frequency.setValueAtTime(f,now);o2.frequency.setValueAtTime(f,now);g.gain.setValueAtTime(Math.min(V(),.05+t*.02),now)}
 },220);siren={o1,o2,g,iv}}
function stopSiren(){if(!siren)return;clearInterval(siren.iv);try{siren.o1.stop();siren.o2.stop()}catch(e){}siren=null}
let alarmEv=null;
function showAlarm(e,test){alarmEv=e;$('#alClock').textContent=e.start;$('#alLbl').textContent=e.title;$('#alNote').textContent=e.note||'';$('#alarm').classList.remove('hidden');startSiren();if(!test)sysNotif('⏰ '+e.title,e.note||e.start)}
$('#alStop').onclick=()=>{stopSiren();$('#alarm').classList.add('hidden')};
$('#alSnooze').onclick=()=>{stopSiren();$('#alarm').classList.add('hidden');const e=alarmEv;toast('😴','Отложено на 5 минут',e.title);setTimeout(()=>showAlarm(e),5*60000)};

/* ===== движок напоминаний ===== */
const fired=new Set();
setInterval(()=>{if(!U||!U.profile)return;const now=new Date(),m=now.getHours()*60+now.getMinutes(),ds=iso(now);
 const lc=$('#liveClock');if(lc)lc.textContent=fmt(m);
 eventsFor(now).forEach(e=>{if(toMin(e.start)!==m)return;const k=ds+e.id+e.start;if(fired.has(k))return;fired.add(k);
  if(e.alarm)showAlarm(e);else{const T=TYPES[e.type]||TYPES.other;toast(T.i,e.title,e.note||(e.start+'–'+e.end));sysNotif(T.i+' '+e.title,e.note||e.start+'–'+e.end);chime()}
  if(view==='home')vHome();
 })},5000);

/* ===== айфон (Capacitor): системные уведомления ===== */
var NATIVE=!!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform());
var LN=null;if(NATIVE){try{LN=(window.Capacitor.Plugins&&window.Capacitor.Plugins.LocalNotifications)||window.Capacitor.registerPlugin('LocalNotifications')}catch(e){}document.documentElement.classList.add('native')}
var syncT=null;
function syncNotifs(){if(!LN||!U||!U.profile)return;clearTimeout(syncT);syncT=setTimeout(doSync,700)}
async function doSync(){try{
 const pend=await LN.getPending();if(pend.notifications&&pend.notifications.length)await LN.cancel({notifications:pend.notifications.map(n=>({id:n.id}))});
 const list=[],now=new Date();let id=1;
 const evs=[...U.events].sort((a,b)=>(b.alarm?1:0)-(a.alarm?1:0));
 for(const e of evs){const T=TYPES[e.type]||TYPES.other,[h,m]=e.start.split(':').map(Number);
  const base={title:(e.alarm?'⏰ ':T.i+' ')+e.title,body:e.note||(e.start+'–'+e.end),extra:{eid:e.id}};if(e.alarm)base.sound='alarm.wav';
  if(e.date){const[y,mo,d]=e.date.split('-').map(Number),at=new Date(y,mo-1,d,h,m);if(at>now)list.push(Object.assign({},base,{id:id++,schedule:{at,allowWhileIdle:true}}))}
  else for(const d of e.days)list.push(Object.assign({},base,{id:id++,schedule:{on:{weekday:d+1,hour:h,minute:m},allowWhileIdle:true}}));
  if(list.length>=60)break}
 if(list.length)await LN.schedule({notifications:list.slice(0,60)});
}catch(e){console.log('notif sync error',e)}}
if(LN){try{LN.addListener('localNotificationActionPerformed',a=>{const id=a&&a.notification&&a.notification.extra&&a.notification.extra.eid,e=U&&U.events.find(x=>x.id===id);if(e&&e.alarm)showAlarm(e,true)})}catch(e){}}

/* ===== старт ===== */
function boot(){U=DB.current&&DB.users[DB.current];if(!U){show('auth');return}U.done=U.done||{};U.log=U.log||{};U.progress=U.progress||[];U.settings=U.settings||{vol:.9,sound:'siren'};if(!U.profile)startOnb();else openApp()}
boot();
</script>
</body>
