<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#07060f">
<title>RITM — режим, питание, тренировки</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--brd:rgba(255,255,255,.13);--txt:#f3f0ff;--mut:#a7a2c6;--a1:#a66bff;--a2:#ff5fc8;--a3:#5fd4ff;--ok:#5fe39a;--bad:#ff6b8a;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Manrope,system-ui,sans-serif;color:var(--txt);background:#07060f;overflow:hidden;touch-action:manipulation;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
#bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:radial-gradient(1100px 760px at 85% -10%,#24124a 0%,transparent 60%),radial-gradient(900px 700px at -10% 110%,#36103a 0%,transparent 55%),#07060f}
.blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:.45;animation:float 20s ease-in-out infinite}
.b1{width:380px;height:380px;background:#7b3cff;top:-90px;left:30%}.b2{width:320px;height:320px;background:#ff3fb4;bottom:-80px;right:6%;animation-delay:-7s}.b3{width:260px;height:260px;background:#2fb8ff;top:45%;left:-80px;animation-delay:-12s;opacity:.28}
@keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(30px,-25px) scale(1.06)}}
.glass{background:linear-gradient(145deg,rgba(255,255,255,.10),rgba(255,255,255,.035));border:1px solid var(--brd);backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);border-radius:22px;box-shadow:0 10px 36px rgba(0,0,0,.32),inset 0 1px 0 rgba(255,255,255,.16)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 16px;border-radius:14px;border:1px solid var(--brd);background:linear-gradient(145deg,rgba(255,255,255,.14),rgba(255,255,255,.04));cursor:pointer;font-weight:700;transition:.16s;box-shadow:inset 0 1px 0 rgba(255,255,255,.2);white-space:nowrap}
.btn:active{transform:scale(.97)}
@media (hover:hover){.btn:hover{border-color:rgba(255,255,255,.3);background:linear-gradient(145deg,rgba(255,255,255,.2),rgba(255,255,255,.06))}}
.btn.pri{background:linear-gradient(135deg,var(--a1),var(--a2));border-color:transparent;box-shadow:0 8px 22px rgba(166,107,255,.38),inset 0 1px 0 rgba(255,255,255,.35)}
.btn.danger{background:linear-gradient(135deg,#ff4d6d,#ff7a59);border-color:transparent}
.btn.sm{padding:7px 12px;border-radius:11px;font-size:13px}
.btn.icon{width:40px;height:40px;padding:0;border-radius:13px;font-size:18px}
.btn.block{width:100%}
input,select,textarea{width:100%;padding:12px 14px;border-radius:13px;border:1px solid var(--brd);background:rgba(0,0,0,.28);outline:none;transition:.15s;font-size:16px}
input:focus,select:focus,textarea:focus{border-color:var(--a1);box-shadow:0 0 0 3px rgba(166,107,255,.22)}
select option{background:#1a1530}
input[type=time],input[type=date]{color-scheme:dark;min-height:46px}
label.f{display:block;font-size:13px;color:var(--mut);margin:12px 0 6px;font-weight:700}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:8px 13px;border-radius:999px;border:1px solid var(--brd);background:rgba(255,255,255,.05);cursor:pointer;font-weight:700;font-size:14px;transition:.15s;user-select:none;-webkit-user-select:none}
.chip.on{background:linear-gradient(135deg,rgba(166,107,255,.6),rgba(255,95,200,.45));border-color:rgba(255,255,255,.35);box-shadow:0 4px 14px rgba(166,107,255,.3)}
.mut{color:var(--mut)}
.logo{font-family:Unbounded,sans-serif;font-weight:700;letter-spacing:.08em;background:linear-gradient(90deg,#fff,#d9b8ff 45%,#ff8fd8);-webkit-background-clip:text;background-clip:text;color:transparent}
.appic{border-radius:50%;box-shadow:0 6px 20px rgba(255,140,40,.3);display:block;flex-shrink:0}
.brand{display:flex;align-items:center;gap:9px}
.screen{position:relative;z-index:1;height:100%}
.center{display:flex;align-items:center;justify-content:center;min-height:100%;padding:calc(20px + var(--st)) 16px calc(20px + var(--sb));overflow:auto;height:100%}
.card{width:100%;max-width:440px;padding:26px}.card.wide{max-width:600px}
.tabs{display:flex;background:rgba(0,0,0,.25);border-radius:14px;padding:4px;gap:4px}
.tabs button{flex:1;padding:9px;border:0;background:none;border-radius:11px;cursor:pointer;font-weight:700;color:var(--mut)}
.tabs button.on{background:linear-gradient(135deg,rgba(166,107,255,.6),rgba(255,95,200,.45));color:#fff}
.err{color:#ff8aa0;font-size:13px;min-height:18px;margin-top:8px}
.steps{display:flex;gap:6px;margin:14px 0 18px}.steps i{flex:1;height:5px;border-radius:9px;background:rgba(255,255,255,.12)}.steps i.on{background:linear-gradient(90deg,var(--a1),var(--a2))}
h2{font-family:Unbounded,sans-serif;font-size:19px;margin-bottom:4px;font-weight:700}
h3{font-size:16px;margin-bottom:10px;font-weight:800}
/* каркас */
#app{display:flex;gap:16px;padding:calc(16px + var(--st)) 16px calc(16px + var(--sb))}
.side{width:220px;flex-shrink:0;padding:18px 12px;display:flex;flex-direction:column;gap:4px}
.side .brand{padding:0 8px 16px}.side .brand .logo{font-size:17px}
.nav{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:14px;cursor:pointer;font-weight:700;color:var(--mut);border:1px solid transparent;transition:.15s;user-select:none;-webkit-user-select:none}
.nav.on{color:#fff;background:linear-gradient(145deg,rgba(166,107,255,.34),rgba(255,95,200,.16));border-color:rgba(255,255,255,.16)}
.nav .ic{font-size:18px;width:22px;text-align:center}
.side .sp{flex:1}
.mtop{display:none}
.main{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-right:2px}
.main::-webkit-scrollbar{width:7px}.main::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:9px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px}
.top h1{font-family:Unbounded,sans-serif;font-size:22px;font-weight:700;line-height:1.2}
.top .sub{font-size:13px;color:var(--mut);font-weight:600;margin-bottom:2px;text-transform:capitalize}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.pad{padding:18px}.mt{margin-top:14px}
.stat .v{font-family:Unbounded,sans-serif;font-size:22px;margin-top:4px}.stat .l{font-size:12px;color:var(--mut);font-weight:700}
.fab{position:fixed;right:22px;bottom:calc(24px + var(--sb));z-index:20;width:58px;height:58px;border-radius:20px;border:0;font-size:28px;background:linear-gradient(135deg,var(--a1),var(--a2));box-shadow:0 10px 30px rgba(166,107,255,.5);cursor:pointer;color:#fff}
.fab:active{transform:scale(.94)}
/* дела */
.evlist{display:flex;flex-direction:column;gap:8px}
.ev{display:flex;gap:11px;align-items:center;padding:10px 10px 10px 12px;border-radius:16px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.07);position:relative;overflow:hidden;cursor:pointer;transition:.15s}
.ev::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.evi{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:19px;background:color-mix(in srgb,var(--c) 20%,transparent);flex-shrink:0}
.evb{flex:1;min-width:0}.evb .ti{font-weight:800;font-size:15px}.evb .no{font-size:12.5px;color:var(--mut);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev.done{background:rgba(95,227,154,.08);border-color:rgba(95,227,154,.25)}.ev.done .ti{text-decoration:line-through;opacity:.7}
.ev.miss{background:rgba(255,107,138,.07);border-color:rgba(255,107,138,.25)}.ev.miss .ti{opacity:.7}
.ev.now{box-shadow:0 0 0 1.5px rgba(255,95,200,.6),0 0 22px rgba(255,95,200,.2)}
.mk{display:flex;gap:6px;flex-shrink:0}
.mb{width:36px;height:36px;border-radius:11px;border:1px solid var(--brd);background:rgba(255,255,255,.05);cursor:pointer;font-weight:900;font-size:16px;color:var(--mut);transition:.15s}
.mb.ok.on{background:var(--ok);border-color:transparent;color:#05220f;box-shadow:0 4px 14px rgba(95,227,154,.4)}
.mb.no.on{background:var(--bad);border-color:transparent;color:#fff;box-shadow:0 4px 14px rgba(255,107,138,.4)}
.badge{font-size:11px;padding:2px 7px;border-radius:99px;background:rgba(255,255,255,.1);font-weight:700;vertical-align:2px}
.sumrow{display:flex;gap:8px;flex-wrap:wrap;font-weight:800;font-size:13px}
.pill{padding:6px 11px;border-radius:99px;background:rgba(255,255,255,.07)}
.pill.ok{background:rgba(95,227,154,.15);color:var(--ok)}.pill.no{background:rgba(255,107,138,.14);color:var(--bad)}
.prog{height:9px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden;display:flex}.prog i{display:block;height:100%}
.prog .p1{background:linear-gradient(90deg,#3fd98a,#5fe39a)}.prog .p2{background:var(--bad)}.prog .pg{background:linear-gradient(90deg,var(--a3),var(--a1),var(--a2))}
/* календарь */
.cal{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px;align-items:start}
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px}
.calhead .m{font-family:Unbounded,sans-serif;font-size:17px;text-transform:capitalize;text-align:center;flex:1}
.dow,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dow div{text-align:center;font-size:11px;color:var(--mut);font-weight:800;padding-bottom:2px}
.day{min-height:58px;border-radius:14px;padding:6px 4px 5px;cursor:pointer;border:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.035);display:flex;flex-direction:column;align-items:center;justify-content:space-between;transition:.15s;min-width:0;user-select:none;-webkit-user-select:none}
.day .n{font-weight:800;font-size:15px}
.day.out{opacity:.28}.day.we .n{color:#ffb3d9}
.day.today{border-color:rgba(255,95,200,.7);box-shadow:inset 0 0 0 1px rgba(255,95,200,.4)}
.day.sel{background:linear-gradient(150deg,rgba(166,107,255,.55),rgba(255,95,200,.3));border-color:rgba(255,255,255,.4)}
.dots{display:flex;gap:2px;justify-content:center;flex-wrap:wrap;max-width:100%}.dots i{width:6px;height:6px;border-radius:50%}
.dbar{width:70%;height:3px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}.dbar i{display:block;height:100%;background:var(--ok)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:14px;font-size:12px;color:var(--mut);font-weight:600}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
/* модалка / шторка */
.ov{position:fixed;inset:0;z-index:50;background:rgba(5,3,12,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .2s}
.ov .card{max-height:90vh;overflow:auto;animation:pop .25s cubic-bezier(.2,1.3,.4,1);background:linear-gradient(160deg,rgba(40,28,70,.96),rgba(20,14,36,.97))}
.grab{display:none;width:42px;height:5px;border-radius:9px;background:rgba(255,255,255,.25);margin:-8px auto 12px}
@keyframes fade{from{opacity:0}}@keyframes pop{from{transform:scale(.94);opacity:0}}@keyframes up{from{transform:translateY(100%)}}
.typegrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px}
.tg{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px;border-radius:14px;border:1px solid var(--brd);background:rgba(255,255,255,.04);cursor:pointer;font-size:10.5px;font-weight:700;color:var(--mut);text-align:center;transition:.15s}
.tg b{font-size:21px}.tg.on{color:#fff;border-color:var(--c);background:color-mix(in srgb,var(--c) 22%,transparent);box-shadow:0 0 0 1px var(--c)}
.evhead{display:flex;gap:12px;align-items:center;margin-bottom:6px}
.evhead .evi{width:50px;height:50px;font-size:26px;border-radius:16px}
.timebox{display:flex;align-items:center;gap:8px}.timebox span{color:var(--mut);font-weight:800}
/* будильник */
#alarm{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;background:radial-gradient(circle at center,rgba(255,95,200,.35),rgba(7,6,15,.94) 60%);backdrop-filter:blur(10px);text-align:center;padding:20px}
#alarm .clock{font-family:Unbounded,sans-serif;font-size:min(22vw,110px);animation:pulse 1s infinite}#alarm .lbl{font-size:24px;font-weight:800}
@keyframes pulse{50%{transform:scale(1.06);text-shadow:0 0 40px #ff5fc8}}
.ring{width:130px;height:130px;border-radius:50%;display:grid;place-items:center;font-size:56px;background:linear-gradient(135deg,var(--a1),var(--a2));animation:ring 1.2s infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(255,95,200,.6)}100%{box-shadow:0 0 0 46px rgba(255,95,200,0)}}
#toasts{position:fixed;right:16px;top:calc(14px + var(--st));z-index:90;display:flex;flex-direction:column;gap:8px;max-width:340px}
.toast{padding:12px 14px;animation:slide .3s;display:flex;gap:11px;align-items:center;background:linear-gradient(160deg,rgba(40,28,70,.95),rgba(20,14,36,.96))}
.toast b{display:block}
@keyframes slide{from{transform:translateY(-14px);opacity:0}}
/* питание / тренировки */
.bar{height:7px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:7px}.bar i{display:block;height:100%;border-radius:9px}
table{width:100%;border-collapse:collapse;font-size:14px}td{padding:8px 4px;border-bottom:1px solid rgba(255,255,255,.07)}td.r{text-align:right;color:var(--mut);white-space:nowrap}
.ex{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.07);font-size:14.5px;cursor:pointer}
.ex:last-child{border-bottom:0}
.ex .nm{flex:1;font-weight:700}.ex .rp{color:var(--mut);font-weight:800;white-space:nowrap}
.ex .ck{width:26px;height:26px;border-radius:9px;border:1.5px solid var(--brd);display:grid;place-items:center;font-size:14px;flex-shrink:0;transition:.15s}
.ex.on .ck{background:var(--ok);border-color:transparent;color:#05220f;font-weight:900}.ex.on .nm{text-decoration:line-through;opacity:.6}
.ex.static{cursor:default}
.gtags{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}.gtag{font-size:12px;font-weight:800;padding:4px 10px;border-radius:99px;background:rgba(166,107,255,.22)}
.note{font-size:13px;color:var(--mut);padding:11px 13px;border-radius:13px;background:rgba(255,255,255,.04);border:1px dashed rgba(255,255,255,.14);line-height:1.45}
.hero{padding:18px 20px;display:flex;justify-content:space-between;align-items:center;gap:14px}
.hero .big{font-family:Unbounded,sans-serif;font-size:34px}
.sw{position:relative;width:46px;height:27px;border-radius:99px;background:rgba(255,255,255,.15);cursor:pointer;flex-shrink:0;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:linear-gradient(135deg,var(--a1),var(--a2))}.sw.on::after{left:22px}
.li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.07)}
.li:last-child{border-bottom:0}
.link{cursor:pointer}
input[type=range]{padding:0;accent-color:var(--a2);border:0;background:none}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:150px;border:2px dashed rgba(255,255,255,.2);border-radius:18px;cursor:pointer;margin-top:10px;background:rgba(255,255,255,.03);overflow:hidden;text-align:center;padding:10px}
.drop img{width:100%;max-height:260px;object-fit:cover;border-radius:13px}
.scan{position:relative;padding:16px;border-radius:14px;background:rgba(255,255,255,.05);margin-top:12px;overflow:hidden;font-weight:700}
.scan::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(166,107,255,.35),transparent);animation:sh 1.3s infinite}
@keyframes sh{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.parsed{font-size:12.5px;color:var(--mut);margin-top:8px;line-height:1.5}
/* прогресс / фото */
.seg{display:flex;background:rgba(0,0,0,.25);border-radius:14px;padding:4px;gap:4px;margin-bottom:14px}
.seg button{flex:1;padding:9px 6px;border:0;background:none;border-radius:11px;cursor:pointer;font-weight:800;color:var(--mut);font-size:14px}
.seg button.on{background:linear-gradient(135deg,rgba(166,107,255,.6),rgba(255,95,200,.45));color:#fff}
.cmp{position:relative;aspect-ratio:3/4;max-width:420px;border-radius:18px;overflow:hidden;background:#000;margin:12px auto 0;user-select:none;-webkit-user-select:none}
.cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.cl{position:absolute;top:0;bottom:0;width:3px;background:#fff;box-shadow:0 0 14px #ff5fc8;transform:translateX(-50%);pointer-events:none}
.cl::after{content:"⇆";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--a1),var(--a2));display:grid;place-items:center;font-weight:800}
.cmp input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;margin:0}
.tag{position:absolute;top:10px;padding:5px 10px;border-radius:99px;background:rgba(0,0,0,.6);font-size:12px;font-weight:800;pointer-events:none}.tag.l{left:10px}.tag.r{right:10px}
.side2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.side2 div{position:relative;aspect-ratio:3/4;border-radius:16px;overflow:hidden;background:#000}.side2 img{width:100%;height:100%;object-fit:cover}
.mon{font-family:Unbounded,sans-serif;font-size:14px;margin:18px 0 10px;text-transform:capitalize;color:#e3d6ff}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.ph{border-radius:16px;overflow:hidden;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);position:relative;cursor:pointer}
.ph .im{aspect-ratio:3/4;background:rgba(0,0,0,.3);display:grid;place-items:center;font-size:30px}.ph .im img{width:100%;height:100%;object-fit:cover}
.ph .in{padding:8px 10px;font-size:12.5px}.ph .st{position:absolute;top:8px;left:8px;font-size:11px;font-weight:900;padding:3px 8px;border-radius:99px;background:linear-gradient(135deg,var(--a1),var(--a2))}
.msum{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.07)}.msum:last-child{border:0}
.msum .d{width:10px;height:10px;border-radius:50%;background:var(--a2);box-shadow:0 0 10px var(--a2);flex-shrink:0}
/* лайтбокс */
#lb{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.94);display:flex;align-items:center;justify-content:center;touch-action:none;overflow:hidden}
#lb img{max-width:100%;max-height:100%;transform-origin:center;will-change:transform;user-select:none;-webkit-user-select:none}
#lb .lbt{position:absolute;top:calc(12px + var(--st));left:14px;right:14px;display:flex;justify-content:space-between;align-items:center;font-weight:800;z-index:2}
#lb .nav2{position:absolute;bottom:calc(20px + var(--sb));left:0;right:0;display:flex;justify-content:center;gap:12px;z-index:2}
/* профиль */
.avatar{width:64px;height:64px;border-radius:22px;display:grid;place-items:center;font-family:Unbounded;font-size:26px;background:linear-gradient(135deg,var(--a1),var(--a2));flex-shrink:0}
.goalgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.goal{padding:12px;border-radius:15px;border:1px solid var(--brd);background:rgba(255,255,255,.04);cursor:pointer;transition:.15s}
.goal b{display:block;font-size:15px}.goal span{font-size:12px;color:var(--mut)}

 .side .brand,.side .sp,.side .dsk{display:none}
 .nav{flex:1;flex-direction:column;gap:1px;padding:7px 2px;font-size:10px;border-radius:16px;min-width:0}
 .nav .ic{font-size:20px;width:auto}
 .top h1{font-size:19px}
 .fab{bottom:calc(84px + var(--sb));right:16px;width:54px;height:54px}
 #toasts{left:12px;right:12px;max-width:none}
 .ov{align-items:flex-end;padding:0}
 .ov .card{max-width:none;border-radius:26px 26px 0 0;max-height:92vh;padding:22px 18px calc(18px + var(--sb));animation:up .28s cubic-bezier(.2,.9,.3,1)}
 .grab{display:block}
 .pad{padding:15px}
 .hero .big{font-size:26px}
 .day{min-height:50px;border-radius:12px}.day .n{font-size:14px}
 .dow,.days{gap:4px}
 .typegrid{grid-template-columns:repeat(5,minmax(0,1fr))}
 .g3.stats3{grid-template-columns:repeat(3,minmax(0,1fr))}
}

<body>

 <div class="brand"><img src="icon.png" class="appic" width="52" height="52" alt=""><div><div class="logo" style="font-size:24px">RITM</div><div class="mut" style="font-size:13px">режим · еда · тренировки</div></div></div>
 <div class="tabs" style="margin:20px 0 4px"><button type="button" data-m="login" class="on">Вход</button><button type="button" data-m="reg">Регистрация</button></div>
 <label class="f">Логин</label><input id="aLogin" maxlength="24" placeholder="например, vlad" autocapitalize="off" autocorrect="off" spellcheck="false">
 <label class="f">Пароль</label><input id="aPass" type="password" placeholder="минимум 4 символа">

 <div class="mut" style="font-size:12px;margin-top:14px;text-align:center;line-height:1.5">Аккаунт хранится на этом устройстве.<br><span class="link" id="restoreLink" style="color:#d9b8ff;font-weight:700">Восстановить из резервной копии</span></div>
</form></div></div>

 <div class="mtop"><div class="brand"><img src="icon.png" class="appic" width="28" height="28" alt=""><span class="logo">RITM</span></div><div class="row" style="flex:0;gap:8px"><button class="btn icon" data-go="alarm" aria-label="Будильник">⏰</button><button class="avbtn" data-go="prof" id="avTop" aria-label="Профиль">В</button></div></div>
 <nav class="side glass" id="side">
  <div class="brand"><img src="icon.png" class="appic" width="32" height="32" alt=""><span class="logo">RITM</span></div>

  <div class="nav" data-v="cal"><span class="ic">📅</span>Календарь</div>
  <div class="nav" data-v="food"><span class="ic">🥗</span>Питание</div>

 </nav>
 <main class="main" id="view"></main>

 <div class="row" style="gap:12px;margin-top:10px"><button class="btn" id="alSnooze">😴 Ещё 5 минут</button><button class="btn pri" id="alStop">✅ Я встал</button></div></div>
<div id="toasts"></div>

<script>
/* ===== утилиты ===== */
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const toMin=t=>{const[a,b]=(t||'0:0').split(':').map(Number);return a*60+b};
const fmt=m=>{m=((m%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const pdate=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const DOW=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'],ORDER=[1,2,3,4,5,6,0];
const DOWF=['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
const MON=['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
const MONG=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const fdate=s=>{const d=pdate(s);return d.getDate()+' '+MONG[d.getMonth()]};
const r1=v=>Math.round(v*10)/10,sgn=v=>(v>0?'+':v<0?'−':'')+Math.abs(r1(v)).toFixed(1);
const TYPES={wake:{n:'Подъём',c:'#ffb86b',i:'⏰'},hygiene:{n:'Гигиена',c:'#6bd5ff',i:'🚿'},warm:{n:'Зарядка',c:'#ffe66b',i:'🤸'},food:{n:'Еда',c:'#5fe39a',i:'🍳'},gym:{n:'Зал',c:'#ff5fc8',i:'🏋️'},sport:{n:'Спорт',c:'#b06bff',i:'⚽'},study:{n:'Учёба',c:'#9aa8c8',i:'📚'},pc:{n:'Компьютер',c:'#6b8bff',i:'💻'},sleep:{n:'Сон',c:'#8a7dff',i:'🌙'},other:{n:'Другое',c:'#e0dcf0',i:'✨'}};
const GOALS={cut:['🔥 Сушка','минус жир'],bulk:['💪 Масса','набор мышц'],keep:['⚖️ Форма','поддержание'],regime:['🗓️ Режим','только расписание']};
const GROUPS={chest:'Грудь',back:'Спина',shoulders:'Плечи',biceps:'Бицепс',triceps:'Трицепс',legs:'Ноги',abs:'Пресс',forearms:'Предплечья',cardio:'Кардио'};
const LIB={
 chest:[['Жим штанги лёжа','4×8'],['Жим гантелей на наклонной','3×10'],['Разводка гантелей','3×12'],['Отжимания на брусьях','3×макс']],
 back:[['Подтягивания','4×макс'],['Тяга штанги в наклоне','4×8'],['Тяга верхнего блока','3×10'],['Тяга гантели одной рукой','3×10']],
 shoulders:[['Жим стоя / сидя','4×8'],['Махи в стороны','4×15'],['Махи в наклоне','3×15'],['Face pull','3×15']],
 biceps:[['Подъём штанги на бицепс','3×10'],['Молотки','3×12'],['Концентрированный подъём','2×12']],
 triceps:[['Французский жим','3×10'],['Разгибания на блоке','3×12'],['Жим узким хватом','3×8']],
 legs:[['Приседания','4×8'],['Румынская тяга','3×10'],['Жим ногами','3×12'],['Выпады','3×10'],['Икры стоя','4×15']],
 abs:[['Подъёмы ног в висе','3×12'],['Скручивания','3×15'],['Планка','3×45 с']],
 forearms:[['Сгибания запястий','3×15'],['Обратные сгибания','3×15'],['Фермерская прогулка','3×40 с']],
 cardio:[['Кардио (дорожка / велик)','20–30 мин']],
};
const WARM=[['Вращения шеей','10 раз'],['Круги плечами','15+15'],['Наклоны корпуса','10 раз'],['Приседания без веса','15 раз'],['Отжимания','10 раз'],['Планка','30 с'],['Растяжка груди у стены','30 с']];

/* ===== хранилище ===== */
const KEY='ritm_v1';
function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
let DB=load()||{users:{},current:null};let U=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}if(typeof syncNotifs==='function')syncNotifs()}
async function hash(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('ritm:'+s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=7;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return'x'+h}}
function show(id){['auth','onb','app'].forEach(x=>$('#'+x).classList.toggle('hidden',x!==id));if(id!=='app')$('#fab').classList.add('hidden')}
function ageOf(p){if(p.birth){const b=pdate(p.birth),n=new Date();let a=n.getFullYear()-b.getFullYear();if(n.getMonth()<b.getMonth()||(n.getMonth()===b.getMonth()&&n.getDate()<b.getDate()))a--;return a}return p.age||18}
function defaultPlan(days){const S={1:[['chest','back','legs']],2:[['chest','shoulders','triceps'],['back','legs','biceps']],3:[['chest','biceps','triceps'],['back','shoulders','forearms'],['legs','abs']],4:[['chest','triceps'],['back','biceps'],['legs','abs'],['shoulders','forearms']]};const s=S[Math.min(4,days.length)]||[];const o={};days.forEach((d,i)=>o[d]=[...(s[i%Math.max(1,s.length)]||['chest','back'])]);return o}
function migrate(u){
 u.mark=u.mark||{};if(u.done){for(const[ds,a]of Object.entries(u.done)){u.mark[ds]=u.mark[ds]||{};a.forEach(id=>u.mark[ds][id]='done')}delete u.done}
 u.log=u.log||{};u.progress=u.progress||[];u.gym=u.gym||{};u.settings=u.settings||{vol:.9,sound:'siren'};
 const p=u.profile;if(p){p.studyDays=p.studyDays||[1,2,3,4,5];p.gymDays=p.gymDays||[];if(!p.gymPlan)p.gymPlan=defaultPlan(ORDER.filter(d=>p.gymDays.includes(d)));if(p.birth===undefined)p.birth=''}
 if(p&&!u.weighEv){if(!u.events.some(e=>e.kind==='weigh'))u.events.push(mkWeigh());u.weighEv=true}
 if(p&&!u.checkinEv){if(!u.events.some(e=>e.checkin))u.events.push(mkCheckin(p));u.checkinEv=true}
}
const mkWeigh=()=>({id:uid(),title:'Записать вес',type:'other',kind:'weigh',start:'14:00',end:'14:05',days:[5],date:null,alarm:false,note:'Встань на весы и впиши вес в приложении',skip:[]});
const mkCheckin=p=>{const w=toMin(p.wake);return{id:uid(),title:'Фото прогресса',type:'other',checkin:true,start:fmt(w+3),end:fmt(w+8),days:[6],date:null,alarm:false,note:'Одно место, свет и поза — вкладка «Фото»',skip:[]}};

/* ===== вход ===== */
let authMode='login';
$$('.tabs button').forEach(b=>b.onclick=()=>{authMode=b.dataset.m;$$('.tabs button').forEach(x=>x.classList.toggle('on',x===b));$('#aPass2Wrap').classList.toggle('hidden',authMode!=='reg');$('#aBtn').textContent=authMode==='reg'?'Создать аккаунт':'Войти';$('#aErr').textContent=''});
$('#authForm').onsubmit=async e=>{e.preventDefault();
 const l=$('#aLogin').value.trim().toLowerCase(),p=$('#aPass').value,err=$('#aErr');
 if(!/^[a-zа-я0-9_.-]{3,24}$/i.test(l))return err.textContent='Логин: 3–24 символа (буквы, цифры, _ . -)';
 if(p.length<4)return err.textContent='Пароль минимум 4 символа';
 const h=await hash(p);
 if(authMode==='reg'){if(DB.users[l])return err.textContent='Такой логин уже есть на этом устройстве';if(p!==$('#aPass2').value)return err.textContent='Пароли не совпадают';
  DB.users[l]={login:l,hash:h,profile:null,events:[],mark:{},log:{},progress:[],gym:{},settings:{vol:.9,sound:'siren'}};}
 else{if(!DB.users[l])return err.textContent='Такого логина нет на этом устройстве. Если переносишь — «Восстановить из резервной копии»';if(DB.users[l].hash!==h)return err.textContent='Неверный пароль'}
 DB.current=l;save();boot();
};
$('#restoreLink').onclick=()=>restoreBox();

/* ===== анкета ===== */
const DEF={name:'',sex:'m',birth:'',age:18,height:178,weight:72,goal:'cut',gymDays:[1,3,5],gymPlan:null,gymTime:'17:00',gymDur:90,sport:'',sportDays:[],sportTime:'18:00',sportDur:60,wake:'06:30',sleep:'23:00',workOn:true,studyDays:[1,2,3,4,5],workFrom:'08:30',workTo:'14:30',pcOn:true,pcFrom:'19:30',pcTo:'22:00',breakfast:'Жареные яйца или немного мяса'};
let ob=null,obStep=0,obRegen=true;const STEPS=['Тело','Цель','Зал','Спорт','День'];
function startOnb(){ob=JSON.parse(JSON.stringify(Object.assign({},DEF,U.profile||{})));if(!ob.gymPlan)ob.gymPlan=defaultPlan(ORDER.filter(d=>ob.gymDays.includes(d)));obStep=0;obRegen=!U.events.length;show('onb');renderOnb()}
const dayChips=k=>`<div class="chips">${ORDER.map(d=>`<div class="chip ${ob[k].includes(d)?'on':''}" data-dk="${k}" data-d="${d}">${DOW[d]}</div>`).join('')}</div>`;
const oneChips=(k,o)=>`<div class="chips">${o.map(([v,t])=>`<div class="chip ${ob[k]===v?'on':''}" data-ok="${k}" data-v="${v}">${t}</div>`).join('')}</div>`;
const inp=(k,t='text',x='')=>`<input data-k="${k}" type="${t}" value="${esc(ob[k])}" ${x}>`;
function renderOnb(){
 let h=`<div class="brand"><img src="icon.png" class="appic" width="28" height="28" alt=""><span class="logo" style="font-size:15px">RITM</span></div><div class="steps">${STEPS.map((s,i)=>`<i class="${i<=obStep?'on':''}"></i>`).join('')}</div>`;
 if(obStep===0)h+=`<h2>Расскажи о себе</h2><div class="mut" style="font-size:14px">Чтобы посчитать калории и подобрать нагрузку</div>
  <label class="f">Имя</label>${inp('name','text','placeholder="Имя" maxlength="20"')}
  <label class="f">Пол</label>${oneChips('sex',[['m','Мужской'],['f','Женский']])}
  <label class="f">Дата рождения</label>${inp('birth','date','max="'+iso(new Date())+'"')}
  <div class="row"><div><label class="f">Рост, см</label>${inp('height','number','inputmode="numeric" min="120" max="230"')}</div><div><label class="f">Вес, кг</label>${inp('weight','number','inputmode="decimal" min="30" max="250" step="0.1"')}</div></div>`;
 if(obStep===1)h+=`<h2>Какая цель?</h2><div class="mut" style="font-size:14px">Можно поменять в любой момент в профиле</div><div class="goalgrid" style="margin-top:16px">${Object.entries(GOALS).map(([k,[t,s]])=>`<div class="goal ${ob.goal===k?'on':''}" data-ok="goal" data-v="${k}"><b>${t}</b><span>${s}</span></div>`).join('')}</div>`;
 if(obStep===2)h+=`<h2>Зал</h2><div class="mut" style="font-size:14px">Выбери дни и что качаешь в каждый день</div>
  <label class="f">Дни тренировок</label>${dayChips('gymDays')}
  ${ORDER.filter(d=>ob.gymDays.includes(d)).map(d=>`<label class="f" style="text-transform:capitalize">${DOWF[d]}</label><div class="chips">${Object.entries(GROUPS).map(([g,n])=>`<div class="chip ${(ob.gymPlan[d]||[]).includes(g)?'on':''}" data-gp="${d}" data-g="${g}">${n}</div>`).join('')}</div>`).join('')}
  <div class="row"><div><label class="f">Во сколько</label>${inp('gymTime','time')}</div><div><label class="f">Минут</label>${inp('gymDur','number','inputmode="numeric" min="20" max="240" step="5"')}</div></div>`;
 if(obStep===3)h+=`<h2>Другой спорт</h2><div class="mut" style="font-size:14px">Футбол, бокс, бег — если есть</div>
  <label class="f">Вид спорта</label>${inp('sport','text','placeholder="оставь пустым, если нет"')}
  <label class="f">Дни</label>${dayChips('sportDays')}
  <div class="row"><div><label class="f">Во сколько</label>${inp('sportTime','time')}</div><div><label class="f">Минут</label>${inp('sportDur','number','inputmode="numeric" min="15" max="300" step="5"')}</div></div>`;
 if(obStep===4)h+=`<h2>Твой обычный день</h2><div class="mut" style="font-size:14px">Соберём стартовое расписание — потом всё правится</div>
  <div class="row"><div><label class="f">Подъём</label>${inp('wake','time')}</div><div><label class="f">Отбой</label>${inp('sleep','time')}</div></div>
  <div class="li"><b>Учёба / работа</b><div class="sw ${ob.workOn?'on':''}" data-sw="workOn"></div></div>
  ${ob.workOn?`${dayChips('studyDays')}<div class="row"><div><label class="f">С</label>${inp('workFrom','time')}</div><div><label class="f">До</label>${inp('workTo','time')}</div></div>`:''}
  <div class="li"><b>Сижу за компьютером</b><div class="sw ${ob.pcOn?'on':''}" data-sw="pcOn"></div></div>
  ${ob.pcOn?`<div class="row"><div><label class="f">С</label>${inp('pcFrom','time')}</div><div><label class="f">До</label>${inp('pcTo','time')}</div></div>`:''}
  <label class="f">Обычный завтрак / перекус</label>${inp('breakfast')}
  ${U.events.length?`<div class="li"><span>Пересобрать расписание<br><span class="mut" style="font-size:12px">иначе твои правки останутся</span></span><div class="sw ${obRegen?'on':''}" id="regenSw"></div></div>`:''}`;
 h+=`<div class="err" id="obErr"></div><div class="row" style="margin-top:6px">${obStep>0?'<button class="btn" id="obBack">← Назад</button>':(U.profile?'<button class="btn" id="obCancel">Отмена</button>':'<span></span>')}<button class="btn pri" id="obNext">${obStep===STEPS.length-1?'Готово ✨':'Дальше →'}</button></div>`;
 const c=$('#onbCard');c.innerHTML=h;
 c.querySelectorAll('[data-k]').forEach(el=>el.oninput=()=>{ob[el.dataset.k]=el.type==='number'?+el.value:el.value});
 c.querySelectorAll('[data-ok]').forEach(el=>el.onclick=()=>{ob[el.dataset.ok]=el.dataset.v;renderOnb()});
 c.querySelectorAll('[data-dk]').forEach(el=>el.onclick=()=>{const a=ob[el.dataset.dk],d=+el.dataset.d;a.includes(d)?a.splice(a.indexOf(d),1):a.push(d);if(el.dataset.dk==='gymDays'){if(!ob.gymPlan[d])ob.gymPlan[d]=['chest','back'];renderOnb()}else el.classList.toggle('on')});
 c.querySelectorAll('[data-gp]').forEach(el=>el.onclick=()=>{const a=ob.gymPlan[el.dataset.gp]=ob.gymPlan[el.dataset.gp]||[],g=el.dataset.g;a.includes(g)?a.splice(a.indexOf(g),1):a.push(g);el.classList.toggle('on')});
 c.querySelectorAll('[data-sw]').forEach(el=>el.onclick=()=>{ob[el.dataset.sw]=!ob[el.dataset.sw];renderOnb()});
 const rs=$('#regenSw');if(rs)rs.onclick=()=>{obRegen=!obRegen;rs.classList.toggle('on',obRegen)};
 if($('#obBack'))$('#obBack').onclick=()=>{obStep--;renderOnb()};

function calcNutrition(p){
 const age=ageOf(p),bmr=10*p.weight+6.25*p.height-5*age+(p.sex==='m'?5:-161);
 const gd=(p.gymDays||[]).length,sd=(p.sport&&p.sport.trim())?(p.sportDays||[]).length:0;
 const act=Math.min(1.9,(p.pcOn?1.25:1.35)+gd*.05+sd*.04),tdee=bmr*act,teen=age<18;
 let kcal=tdee,label='поддержание';
 if(p.goal==='cut'){kcal=Math.max(tdee*(teen?.9:.82),bmr,p.sex==='m'?1700:1400);label='сушка'}
 if(p.goal==='bulk'){kcal=tdee*(teen?1.08:1.1);label='набор массы'}
 const prot=p.weight*(p.goal==='cut'?2:p.goal==='bulk'?1.8:1.6),fat=p.weight*.9,carb=Math.max(80,(kcal-prot*4-fat*9)/4);kcal=prot*4+fat*9+carb*4;
 const plan=[{n:'Завтрак',s:.27,pr:'egg',cb:'oats',ex:[['banana',100]]},{n:'Обед',s:.33,pr:'chicken',cb:'buck',ex:[['veg',200]]},{n:'Перекус',s:.13,pr:'cottage',cb:'bread',ex:[]},{n:'Ужин',s:.27,pr:p.goal==='bulk'?'beef':'fish',cb:'rice',ex:[['veg',200]]}];
 const meals=plan.map(m=>{const P=prot*m.s,F=fat*m.s,C=carb*m.s,pr=FOOD[m.pr],cb=FOOD[m.cb];let eP=0,eC=0;m.ex.forEach(([k,g])=>{eP+=FOOD[k].p*g/100;eC+=FOOD[k].c*g/100});
  let pg=0,cg=0;for(let i=0;i<3;i++){cg=Math.max(0,(C-eC-pg*pr.c/100)/(cb.c/100));pg=Math.max(0,(P-eP-cg*cb.p/100)/(pr.p/100))}
  const items=[];if(pr.pc){const n=Math.max(1,Math.round(pg/pr.pc));items.push(['egg',n*pr.pc,n+' шт'])}else items.push([m.pr,Math.round(pg/5)*5]);
  items.push([m.cb,Math.round(cg/5)*5]);m.ex.forEach(([k,g])=>items.push([k,g]));
  const fNow=items.reduce((a,[k,g])=>a+FOOD[k].f*g/100,0),oil=Math.round(Math.max(0,F-fNow)/5)*5;if(oil>=5&&m.ex.some(x=>x[0]==='veg'))items.push(['oil',oil]);
  const t=items.reduce((a,[k,g])=>({p:a.p+FOOD[k].p*g/100,f:a.f+FOOD[k].f*g/100,c:a.c+FOOD[k].c*g/100,k:a.k+kc(FOOD[k],g)}),{p:0,f:0,c:0,k:0});return{n:m.n,items,t}});
 return{bmr,tdee,kcal,prot,fat,carb,meals,label,teen,water:Math.round(p.weight*35/100)/10};
}

function parseFood(text){
 const parts=text.toLowerCase().replace(/ё/g,'е').split(/,|\+|;|\sи\s|\sс\s|\sсо\s|\n/).map(s=>s.trim()).filter(Boolean);const out=[];
 for(const pt of parts){const f=FDB.find(x=>x[0].test(pt));if(!f)continue;
  let g=null;const mg=pt.match(/(\d+[.,]?\d*)\s*(грам\S*|гр|г|мл|ml|g)(?![а-яa-z])/),mk=pt.match(/(\d+[.,]?\d*)\s*(кг|л)(?![а-яa-z])/),mn=pt.match(/(\d+)\s*(шт|штук\S*|x|х)?/);
  let lbl='';
  if(mg){g=parseFloat(mg[1].replace(',','.'));lbl=g+(/мл|ml/.test(mg[2])?' мл':' г')}else if(mk){g=parseFloat(mk[1].replace(',','.'))*1000;lbl=g+' г'}
  else if(mn&&f[7]){g=+mn[1]*f[7];lbl=mn[1]+' шт'}else if(/пачк|упаков/.test(pt)){g=f[6];lbl='пачка'}else{g=f[6];lbl='порция ~'+f[6]+' г'}
  out.push({n:f[1],g,lbl,k:f[2]*g/100,p:f[3]*g/100,f:f[4]*g/100,c:f[5]*g/100})}
 return out;
}

function lightbox(F,i){

  const im=$('#lbI');im.src=await phURL(x.id)||'';let s=1,tx=0,ty=0,st=null,lastTap=0;const ap=()=>im.style.transform=`translate(${tx}px,${ty}px) scale(${s})`;
  const box=$('#lb'),dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
  box.addEventListener('touchstart',e=>{if(e.target.closest('button'))return;if(e.touches.length===2)st={d:dist(e.touches),s};else if(e.touches.length===1){const n=Date.now();if(n-lastTap<280){s=s>1?1:2.5;tx=ty=0;ap()}lastTap=n;st={x:e.touches[0].clientX-tx,y:e.touches[0].clientY-ty,s}}},{passive:true});
  box.addEventListener('touchmove',e=>{if(!st)return;e.preventDefault();if(e.touches.length===2&&st.d){s=Math.min(5,Math.max(1,st.s*dist(e.touches)/st.d))}else if(e.touches.length===1&&s>1&&st.x!==undefined){tx=e.touches[0].clientX-st.x;ty=e.touches[0].clientY-st.y}ap()},{passive:false});
  box.addEventListener('touchend',()=>{if(s<=1){s=1;tx=ty=0;ap()}st=null});
  box.addEventListener('wheel',e=>{e.preventDefault();s=Math.min(5,Math.max(1,s*(e.deltaY<0?1.15:.87)));if(s===1)tx=ty=0;ap()},{passive:false});
  im.ondblclick=()=>{s=s>1?1:2.5;tx=ty=0;ap()};
  $('#lbX').onclick=()=>$('#lbw').innerHTML='';$('#lbP').onclick=()=>{if(i>0){i--;draw()}};$('#lbN').onclick=()=>{if(i<F.length-1){i++;draw()}};

function askNotif(){if(LN){LN.requestPermissions().then(r=>{const ok=r.display==='granted';toast(ok?'🔔':'⚠️',ok?'Уведомления включены':'Уведомления запрещены',ok?'Будильник и напоминания придут даже при закрытом приложении':'Включи: Настройки → RITM → Уведомления');if(ok)syncNotifs()}).catch(()=>{});return}
 if(!('Notification'in window))return toast('⚠️','Не поддерживается','Напоминания будут внутри приложения');Notification.requestPermission().then(r=>toast(r==='granted'?'🔔':'⚠️',r==='granted'?'Уведомления включены':'Уведомления запрещены','')).catch(()=>{})}
function sysNotif(t,b){try{if(!NATIVE&&'Notification'in window&&Notification.permission==='granted')new Notification(t,{body:b})}catch(e){}}
let AC=null;function ac(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}return AC}
document.addEventListener('pointerdown',ac);
function chime(){const a=ac();if(!a)return;[660,990].forEach((f,i)=>{const o=a.createOscillator(),g=a.createGain();o.frequency.value=f;g.gain.setValueAtTime(0,a.currentTime+i*.18);g.gain.linearRampToValueAtTime(.3*U.settings.vol,a.currentTime+i*.18+.02);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+i*.18+.5);o.connect(g).connect(a.destination);o.start(a.currentTime+i*.18);o.stop(a.currentTime+i*.18+.55)})}
let siren=null;
function startSiren(){stopSiren();const a=ac();if(!a)return;const g=a.createGain(),o1=a.createOscillator(),o2=a.createOscillator(),comp=a.createDynamicsCompressor();o1.type='square';o2.type='sawtooth';o2.detune.value=12;o1.connect(g);o2.connect(g);g.connect(comp).connect(a.destination);o1.start();o2.start();
 const V=()=>U.settings.vol,mode=U.settings.sound;let t=0;g.gain.value=mode==='rise'?.05:V();
 const iv=setInterval(()=>{t++;const n=a.currentTime;if(mode==='siren'){const f=t%2?1320:880;o1.frequency.setValueAtTime(f,n);o2.frequency.setValueAtTime(f,n);g.gain.setValueAtTime(V(),n)}else if(mode==='beep'){o1.frequency.setValueAtTime(1000,n);o2.frequency.setValueAtTime(1000,n);g.gain.setValueAtTime(t%4<3&&t%2?V():0,n)}else{const f=t%2?1100:1386;o1.frequency.setValueAtTime(f,n);o2.frequency.setValueAtTime(f,n);g.gain.setValueAtTime(Math.min(V(),.05+t*.02),n)}},220);siren={o1,o2,iv}}
function stopSiren(){if(!siren)return;clearInterval(siren.iv);try{siren.o1.stop();siren.o2.stop()}catch(e){}siren=null}
let alarmEv=null;
function showAlarm(e,test){alarmEv=e;$('#alClock').textContent=e.start;$('#alLbl').textContent=e.title;$('#alNote').textContent=e.note||'';$('#alarm').classList.remove('hidden');startSiren();if(!test)sysNotif('⏰ '+e.title,e.note||e.start)}
$('#alStop').onclick=()=>{stopSiren();$('#alarm').classList.add('hidden');if(alarmEv&&alarmEv.id&&U){const ds=iso(new Date());(U.mark[ds]=U.mark[ds]||{})[alarmEv.id]='done';save();if(document.querySelector('#app:not(.hidden)'))go(view)}};
$('#alSnooze').onclick=()=>{stopSiren();$('#alarm').classList.add('hidden');const e=alarmEv;toast('😴','Отложено на 5 минут',e.title);setTimeout(()=>showAlarm(e),5*60000)};
const fired=new Set();
setInterval(()=>{if(!U||!U.profile)return;const now=new Date(),m=now.getHours()*60+now.getMinutes(),ds=iso(now);const lc=$('#liveClock');if(lc)lc.textContent=fmt(m);
 eventsFor(now).forEach(e=>{if(toMin(e.start)!==m)return;const k=ds+e.id+e.start;if(fired.has(k))return;fired.add(k);
  if(e.alarm)showAlarm(e);else if(e.kind==='weigh'){toast('⚖️','Время взвеситься','Впиши вес — посчитаю прогресс',['Записать',openWeigh]);chime()}
  else{const T=TYPES[e.type]||TYPES.other;toast(T.i,e.title,e.note||(e.start+'–'+e.end));sysNotif(T.i+' '+e.title,e.note||e.start);chime()}
  if(view==='home'&&!$('#modal').innerHTML)vHome()})},5000);

/* ===== айфон (Capacitor) ===== */
var NATIVE=!!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform());
var LN=null;if(NATIVE){try{LN=(window.Capacitor.Plugins&&window.Capacitor.Plugins.LocalNotifications)||window.Capacitor.registerPlugin('LocalNotifications')}catch(e){}document.documentElement.classList.add('native')}
var syncT=null;function syncNotifs(){if(!LN||!U||!U.profile)return;clearTimeout(syncT);syncT=setTimeout(doSync,700)}
async function doSync(){try{const pend=await LN.getPending();if(pend.notifications&&pend.notifications.length)await LN.cancel({notifications:pend.notifications.map(n=>({id:n.id}))});
 const list=[],now=new Date();let id=1;const evs=[...U.events].sort((a,b)=>((b.alarm||b.kind==='weigh')?1:0)-((a.alarm||a.kind==='weigh')?1:0));
 for(const e of evs){const T=TYPES[e.type]||TYPES.other,[h,m]=e.start.split(':').map(Number);const base={title:(e.alarm?'⏰ ':e.kind==='weigh'?'⚖️ ':T.i+' ')+e.title,body:e.note||(e.start+'–'+e.end),extra:{eid:e.id}};if(e.alarm)base.sound='alarm.wav';
  if(e.date){const at=new Date(...e.date.split('-').map((v,i)=>i===1?v-1:+v),h,m);if(at>now)list.push(Object.assign({},base,{id:id++,schedule:{at,allowWhileIdle:true}}))}
  else for(const d of e.days)list.push(Object.assign({},base,{id:id++,schedule:{on:{weekday:d+1,hour:h,minute:m},allowWhileIdle:true}}));if(list.length>=60)break}
 if(list.length)await LN.schedule({notifications:list.slice(0,60)})}catch(e){console.log('notif sync error',e)}}
if(LN){try{LN.addListener('localNotificationActionPerformed',a=>{const id=a&&a.notification&&a.notification.extra&&a.notification.extra.eid,e=U&&U.events.find(x=>x.id===id);if(!e)return;if(e.alarm)showAlarm(e,true);else if(e.kind==='weigh')openWeigh()})}catch(e){}}
if(NATIVE){try{const AP=(window.Capacitor.Plugins&&window.Capacitor.Plugins.App)||window.Capacitor.registerPlugin('App');const onUrl=u=>{if(!u||!/^ritm:/.test(u))return;const q=u.split('d=')[1];const d=q&&decodeFood(decodeURIComponent(q));if(d&&U&&U.profile){go('food');setTimeout(()=>confirmFood(d),200)}};
 AP.addListener('appUrlOpen',e=>onUrl(e.url));AP.getLaunchUrl().then(r=>{if(r&&r.url)setTimeout(()=>onUrl(r.url),600)}).catch(()=>{})}catch(e){}}
/* отступы под чёлку, если WebView не отдаёт env() */
(function(){const t=document.createElement('div');t.style.cssText='position:fixed;top:0;height:env(safe-area-inset-top,0px);width:1px;visibility:hidden';document.body.appendChild(t);const h=t.offsetHeight;t.remove();
 if(NATIVE&&h===0&&/iPhone|iPad|iPod/.test(navigator.userAgent)){const tall=Math.max(screen.width,screen.height)>=812;document.documentElement.style.setProperty('--st',(tall?50:20)+'px');document.documentElement.style.setProperty('--sb',(tall?30:0)+'px')}})();
/* запрет зума страницы (жесты iOS) */
['gesturestart','gesturechange'].forEach(ev=>document.addEventListener(ev,e=>{if(!e.target.closest||!e.target.closest('#lb'))e.preventDefault()},{passive:false}));

/* ===== старт ===== */
function boot(){U=DB.current&&DB.users[DB.current];if(!U){show('auth');return}migrate(U);save();if(!U.profile)startOnb();else openApp()}
boot();
</script>
